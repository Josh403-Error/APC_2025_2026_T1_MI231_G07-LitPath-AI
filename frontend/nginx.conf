events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Define the upstream backend service
    upstream backend {
        server backend:8000; # Refers to the 'backend' service in docker-compose.yml
    }

    server {
        listen 80;

        # Serve static files from the build directory
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html; # Essential for React Router
        }

        # Proxy API requests to the backend container
        location /api {
            proxy_pass http://backend; # Pass to the upstream defined above
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}