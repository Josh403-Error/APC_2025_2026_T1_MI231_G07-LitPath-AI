version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: litpath-prod-db
    environment:
      POSTGRES_DB: ${DB_NAME:-litpath_prod_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - litpath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Service
  backend:
    build:
      context: ../
      dockerfile: Docker/Dockerfile.backend
    container_name: litpath-prod-backend
    environment:
      - DEBUG=0
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/litpath_prod_db}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend_media:/app/media
      - ./backend_static:/app/staticfiles
      - ../RAG/theses:/app/RAG/theses
    networks:
      - litpath-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ../
      dockerfile: Docker/Dockerfile.frontend
    container_name: litpath-prod-frontend
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=${FRONTEND_API_URL:-http://localhost/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend_build:/app/dist
    networks:
      - litpath-network
    restart: unless-stopped

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: litpath-prod-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - litpath-network
    restart: unless-stopped

networks:
  litpath-network:
    driver: bridge

volumes:
  postgres_data_prod: